auth = "plain[passwd=/etc/ocserv/secrets/ocpasswd]"
tcp-port = 443
udp-port = 443
run-as-user = nobody
run-as-group = daemon
socket-file = /run/ocserv-socket
server-cert = /etc/ocserv/secrets/server-cert.pem
server-key = /etc/ocserv/secrets/server-key.pem
isolate-workers = true
max-clients = 64
max-same-clients = 4
device = vpns
ipv4-network = 10.77.0.0
ipv4-netmask = 255.255.255.0
dns = 1.1.1.1
cisco-client-compat = true
